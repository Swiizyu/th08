name: Build binary

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  devenv:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3
    - name: Get toolchain from cache
      id: cache-toolchain
      uses: actions/cache/restore@v3
      with:
        # A directory to store and save the cache
        path: scripts/prefix
        # An explicit key for restoring and saving the cache
        key: prefix-${{hashFiles('scripts/create_devenv.py')}}
        # No need to download here.
        lookup-only: true
    - if: ${{ steps.cache-toolchain.outputs.cache-hit != 'true' }}
      name: Install prefix
      id: install_prefix
      run: python scripts/create_devenv.py scripts/dls scripts/prefix
    - if: always() && steps.cache-toolchain.outputs.cache-hit != 'true' && steps.install_prefix.outcome == 'success'
      name: Save toolchain to cache
      uses: actions/cache/save@v3
      with:
        # A directory to store and save the cache
        path: scripts/prefix
        key: ${{ steps.cache-toolchain.outputs.cache-primary-key }}

  build:
    needs: ['devenv']
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v5
      with:
        python-version: '3.4'
    - name: Get toolchain from cache
      id: cache-toolchain
      uses: actions/cache/restore@v3
      with:
        # A directory to store and save the cache
        path: scripts/prefix
        # An explicit key for restoring and saving the cache
        key: prefix-${{hashFiles('scripts/create_devenv.py')}}
        # This should never happen, as the devenv step plays before us.
        fail-on-cache-miss: true
    - name: Build binary
      run: |
        python scripts/build.py -j1 *>&1 | Tee-Object -FilePath build_log.txt
        if ($LASTEXITCODE -ne 0) { exit 1 }
    - name: Post build log on failure
      if: failure()
      uses: actions/github-script@v6
      with:
        script: |
          const fs = require('fs');
          if (!fs.existsSync('build_log.txt')) {
            console.log('build_log.txt not found');
            return;
          }
          const log = fs.readFileSync('build_log.txt', 'utf8');
          const tail = log.slice(-28000);
          await github.rest.repos.createCommitComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            commit_sha: context.sha,
            body: '❌ `Build binary` failed on ' + context.sha.slice(0, 7) + '. Log tail:\n```\n' + tail + '\n```',
          });
    - uses: actions/upload-artifact@v4
      with:
        name: th08
        path: |
          build/th08.exe
          build/th08.pdb
